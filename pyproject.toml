[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "independent-synthetic-report-pipeline"
version = "0.1.0"
description = "Clean-room deterministic report automation portfolio MVP"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pypdf==6.10.0",
  "reportlab==4.4.9",
]

[project.scripts]
synthetic-report = "independent_report_pipeline.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
